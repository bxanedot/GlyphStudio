name: Build and publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            task: packageMsi
            extension: msi
          - platform: macOS
            runner: macos-latest
            task: packageDmg
            extension: dmg
          - platform: Linux
            runner: ubuntu-latest
            task: packageDeb
            extension: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build installer on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:${{ matrix.task }}
      - name: Build installer on macOS or Linux
        if: runner.os != 'Windows'
        run: ./gradlew :app:${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        with:
          name: GlyphStudio-${{ matrix.platform }}
          path: app/build/compose/binaries/main/${{ matrix.extension }}/*.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: GlyphStudio-*
          merge-multiple: true
          path: dist
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "Glyph Studio $TAG"
